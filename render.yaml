databases:
  - name: the-majority-accounts
    databaseName: the_majority_accounts
    user: the_majority_accounts_user
    plan: free
    region: singapore
    postgresMajorVersion: 18

services:
  - type: web
    name: the-majority-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MATCH_SIZE
        value: 50
      - key: DATABASE_URL
        fromDatabase:
          name: the-majority-accounts
          property: connectionString
